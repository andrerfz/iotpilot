<!-- app/public/login/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Pilot - Iniciar sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
        }
        .subheader {
            font-size: 1.2em;
            opacity: 0.8;
            margin-top: 10px;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background-color: white;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin: 0 0 24px 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 0.95em;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1em;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #2980b9;
        }
        .btn-primary:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .error-box {
            margin-bottom: 16px;
            padding: 10px 14px;
            background-color: #fdecea;
            color: #c0392b;
            border-left: 4px solid #e74c3c;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<header>
    <h1>IoT Pilot</h1>
    <div class="subheader">Iniciar sesión</div>
</header>
<main>
    <form class="login-card" id="login-form">
        <h2>Acceso al panel</h2>
        <div class="error-box" id="error-box" style="display:none;"></div>
        <div class="form-group">
            <label for="user">Usuario</label>
            <input type="text" id="user" name="user" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Entrar</button>
    </form>
</main>
<script>
    var form = document.getElementById('login-form');
    var errorBox = document.getElementById('error-box');
    var submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        errorBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Entrando...';

        var user = document.getElementById('user').value.trim();
        var password = document.getElementById('password').value;

        try {
            var res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ user: user, password: password })
            });
            var data = {};
            try { data = await res.json(); } catch (_) {}

            if (!res.ok) {
                showError(data.error || ('Error HTTP ' + res.status));
                return;
            }

            var params = new URLSearchParams(window.location.search);
            var next = params.get('next') || '/config/';
            // Only allow same-origin redirects.
            if (!next.startsWith('/')) next = '/config/';
            window.location.replace(next);
        } catch (err) {
            showError('Error de red: ' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Entrar';
        }
    });

    function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
    }
</script>
</body>
</html>
