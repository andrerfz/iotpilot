name: iotpilot

services:
  iotpilot:
    build:
      context: ..
      dockerfile: docker/node/Dockerfile
    container_name: iotpilot-app
    ports:
      - "4000"
    volumes:
      - ../app:/app
      - iotpilot_data:/app/data
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - HOST_NAME=${HOST_NAME:-iotpilot.test}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - SESSION_SECRET=${SESSION_SECRET:-}
    restart: unless-stopped
    command: bash -c "npm install && npm run dev"
    networks:
      - iotpilot_network
      - iotpilot-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iotpilot-http.rule=Host(`${HOST_NAME:-iotpilot.test}`)"
      - "traefik.http.routers.iotpilot-http.entrypoints=web"
      - "traefik.http.routers.iotpilot-https.rule=Host(`${HOST_NAME:-iotpilot.test}`)"
      - "traefik.http.routers.iotpilot-https.entrypoints=websecure"
      - "traefik.http.routers.iotpilot-https.tls=true"
      - "traefik.http.routers.iotpilot-tailscale.rule=Host(`${TAILSCALE_DOMAIN:-no-tailscale-domain}`)"
      - "traefik.http.routers.iotpilot-tailscale.entrypoints=websecure"
      - "traefik.http.routers.iotpilot-tailscale.tls=true"
      - "traefik.http.services.iotpilot.loadbalancer.server.port=4000"

  # Test IoT Device - Connect to iotpilotserver (not iotpilot-app)
  test-device:
    image: ubuntu:22.04
    container_name: iotpilot-test-device
    hostname: test-device-docker
    networks:
      - iotpilot-network
    environment:
      - IOTPILOT_SERVER=${IOTPILOT_SERVER:-iotpilot-server-app:3000}
      - DEVICE_API_KEY=${DEVICE_API_KEY}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - DEVICE_LOCATION=${DEVICE_LOCATION:-docker-test-lab}
      - DEVICE_ID=${DEVICE_ID:-test-device-docker}
      - DEVICE_NAME=${DEVICE_NAME:-test-device-docker}
    restart: "no"
    volumes:
      - ./scripts/test-device-startup.sh:/startup.sh:ro
    command: bash /startup.sh
    profiles:
      - test

  traefik:
    image: traefik:v2.10
    container_name: iotpilot-traefik
    ports:
      - "4080:80"
      - "8080:8080"
      - "4443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/config:/etc/traefik/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/etc/traefik/acme
    networks:
      - iotpilot_network
    restart: unless-stopped
    depends_on:
      - iotpilot
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-contact@iotpilot.tk}

  tailscale:
    image: tailscale/tailscale:latest
    container_name: iotpilot-tailscale
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    network_mode: "service:traefik"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--hostname=${HOST_NAME:-iotpilot.test} --reset
    restart: unless-stopped

volumes:
  iotpilot_data:
    driver: local
  tailscale_state:
    driver: local
  traefik_certs:
    driver: local

networks:
  iotpilot_network:
    driver: bridge
    external: false
  iotpilot-network:
    external: true